<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal</title>
  <script>
    if (!localStorage.getItem('studentid')) {
      window.location.href = 'login.html';
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="d-flex align-items-center justify-content-center gap-2">
    <span>Student Attendance System</span>
    <span class="badge bg-secondary" id="dbStatusBadge" style="font-size: 0.5em;"><i class="bi bi-database"></i> Checking DB...</span>
    <script>
      (function() {
        try {
          const testKey = '__db_test_key__';
          localStorage.setItem(testKey, 'test_val');
          const val = localStorage.getItem(testKey);
          localStorage.removeItem(testKey);
          const badge = document.getElementById('dbStatusBadge');
          if (badge && val === 'test_val') {
            badge.className = 'badge bg-success';
            badge.innerHTML = '<i class="bi bi-database-check"></i> DB Connected';
          }
        } catch (e) {
          const badge = document.getElementById('dbStatusBadge');
          if (badge) {
            badge.className = 'badge bg-danger';
            badge.innerHTML = '<i class="bi bi-database-x"></i> DB Disconnected';
          }
        }
      })();
    </script>
  </header>

  <div class="top-bar">
    <div>
      <strong>Class ID:</strong> <span id="class-id">--</span>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div id="date-time"></div>
      <a href="#" onclick="handleLogout(event)" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </div>
  </div>

  <div class="container mt-4">
    <div class="row justify-content-center mb-4" id="searchRow">
      <div class="col-md-6">
        <div class="input-group shadow-sm">
          <span class="input-group-text bg-primary text-white">
            <i class="bi bi-search"></i>
          </span>
          <input type="text" id="studentIdInput" class="form-control" placeholder="Enter Student ID">
          <button id="searchBtn" class="btn btn-primary">Search</button>
        </div>
      </div>
    </div>

    <div id="studentDetails" class="d-flex justify-content-center mb-4"></div>

    <div class="my-5">
      <div id="calendar" class="mt-3"></div>
    </div>
  </div>

  <footer class="text-center">
    &copy; 2025 Student Attendance System. All rights reserved.
  </footer>

  <!-- JS libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
