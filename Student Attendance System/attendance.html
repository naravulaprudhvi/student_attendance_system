<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance</title>
    <script>
      if (!localStorage.getItem('teacherid') || !localStorage.getItem('classid')) {
        window.location.href = 'login.html';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="d-flex align-items-center justify-content-center gap-2">
        <span>Student Attendance System</span>
        <span class="badge bg-secondary" id="dbStatusBadge" style="font-size: 0.5em;"><i class="bi bi-database"></i> Checking DB...</span>
        <script>
          (function() {
            try {
              const testKey = '__db_test_key__';
              localStorage.setItem(testKey, 'test_val');
              const val = localStorage.getItem(testKey);
              localStorage.removeItem(testKey);
              const badge = document.getElementById('dbStatusBadge');
              if (badge && val === 'test_val') {
                badge.className = 'badge bg-success';
                badge.innerHTML = '<i class="bi bi-database-check"></i> DB Connected';
              }
            } catch (e) {
              const badge = document.getElementById('dbStatusBadge');
              if (badge) {
                badge.className = 'badge bg-danger';
                badge.innerHTML = '<i class="bi bi-database-x"></i> DB Disconnected';
              }
            }
          })();
        </script>
    </header>
    <div class="top-bar">
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <button onclick="goBackToDashboard()" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-left"></i> Back to Dashboard</button>
            <span class="text-muted d-none d-md-inline">|</span>
            <div>
                <strong>Teacher:</strong> <span id="username"></span> |
                <strong>Class ID:</strong> <span id="class-id"></span>
            </div>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div id="date-time"></div>
            <a href="#" onclick="handleLogout(event)" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-left"></i> Logout</a>
        </div>
    </div>

    <div class="container mt-4">
        <h3 class="text-center mb-4">Mark Attendance</h3>
        <div class="d-flex justify-content-end mb-2">
            <input type="checkbox" id="selectAllCheckbox" class="form-check-input">
            <label for="selectAllCheckbox" class="form-label ms-2">Mark All Present</label>
        </div>
        <form id="attendanceForm">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle bg-white">
                    <thead class="table-primary text-center">
                        <tr>
                            <th>Student Name</th>
                            <th>Yesterday's Attendance</th>
                            <th>Mark Present Today</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable">
                        <tr>
                            <td colspan="3" class="text-center text-muted">Loading students...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-success mt-3 px-4">Submit Attendance</button>
            </div>
        </form>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="submitConfirmModal" tabindex="-1" aria-labelledby="submitConfirmLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="submitConfirmLabel">Confirm Attendance Submission</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to submit the attendance?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="confirmSubmitBtn">Yes, Submit</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center">
        &copy; 2025 Student Attendance System. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
