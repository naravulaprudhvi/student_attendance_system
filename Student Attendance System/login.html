<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Attendance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="appname">Student Attendance System</div>

  <form id="loginForm">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body">
              <h3 class="text-center mb-4">Login</h3>

              <div class="mb-3 d-flex gap-3">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="userType" id="userTypeTeacher" value="teacher" checked />
                  <label class="form-check-label form-label" for="userTypeTeacher">Teacher</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="userType" id="userTypeStudent" value="student" />
                  <label class="form-check-label form-label" for="userTypeStudent">Student</label>
                </div>
              </div>

              <div class="mb-3" id="studentIdGroup" style="display: none;">
                <label for="studentid" class="form-label">Student ID</label>
                <input type="text" class="form-control" id="studentid" placeholder="Enter your Student ID" />
              </div>


              <div class="mb-3" id="teacherIdGroup">
                <label for="teacherid" class="form-label">Teacher ID</label>
                <input type="text" class="form-control" id="teacherid" placeholder="Enter your Teacher ID" />
              </div>

              <div class="mb-3" id="classIdGroup">
                <label for="classid" class="form-label">Class</label>
                <select name="classid" class="form-control" id="classid">
                  <option value="" disabled selected>-- Select Class --</option>
                  <!-- dynamically filled -->
                </select>
              </div>

              <div class="mb-3" id="passwordGroup">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" />
              </div>

              <div id="errorMessage" class="error-message"></div>

              <button type="submit" class="btn w-100 custom-login-btn">
                <span class="loading">Logging in...</span>
                <span class="login-text">Login</span>
              </button>

              <button type="button" id="adminLoginBtn" class="btn w-100 mt-3"
                style="display: none; background-color: #343a40; color: white; transition: background-color 0.3s ease;">
                Admin Login
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>

  <footer class="text-center">
    &copy; 2025 Student Attendance System. All rights reserved.
  </footer>

  <script src="app.js"></script>
</body>

</html>
